name: win_lin_release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
##########################################################################
  win:
    runs-on: windows-latest

    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: python setup
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        check-latest: true

    - name: pip upgrade
      run: python -m pip install --upgrade pip

    - name: install requirements
      run: pip install -r requirements.txt

    #####################################
    - name: generate version number
      working-directory: ./scripts
      run: "version.gen.bat"
      shell: cmd

    - name: version upload
      uses: actions/upload-artifact@v4
      with:
        name: version
        path: ./src/version.txt
        if-no-files-found: error

    #####################################
    - name: convert icons to python source
      working-directory: ./scripts
      run: "icons.convert.bat"
      shell: cmd

    #####################################
    - name: run pyinstaller
      working-directory: ./scripts
      run: "pyinstaller.run.bat"
      shell: cmd

    #####################################
    - name: upload win pyinstaller distro
      uses: actions/upload-artifact@v4
      with:
        name: pyinstaller-win
        path: ./build-pyinstaller/sas.win.zip
        if-no-files-found: error

  lin:
    permissions: write-all
    needs: [win]
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: python setup
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        check-latest: true

    - name: pip upgrade
      run: python -m pip install --upgrade pip

    - name: install requirements
      run: pip install -r requirements.txt

    - name: strip python binaries
      run: find $pythonLocation -name *.so* -type f -exec strip {} \;

    #####################################
    - name: version download
      uses: actions/download-artifact@v6
      with:
        name: version
        path: ./src

    #####################################
    - name: version read
      id: version
      run: echo "version=$(cat ./src/version.txt)" >> $GITHUB_OUTPUT

    #####################################
    - name: convert icons to python source
      working-directory: ./scripts
      run: bash "icons.convert.sh"

    #####################################
    - name: run pyinstaller
      working-directory: ./scripts
      run: bash "pyinstaller.run.sh"

    #####################################
    - name: upload lin pyinstaller distro
      uses: actions/upload-artifact@v4
      with:
        name: pyinstaller-lin
        path: ./build-pyinstaller/sas.lin.zip
        if-no-files-found: error

    #####################################
    - name: build flatpak
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y flatpak flatpak-builder xz-utils
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        bash "scripts/flatpak-prepare.sh"
        flatpak-builder --force-clean --user --install-deps-from=flathub flatpak_build_dir io.github.pjdude.SimpleAudioSweeper.yml
        flatpak-builder --user --install --force-clean flatpak_build_dir --repo=flatpak_repo_dir io.github.pjdude.SimpleAudioSweeper.yml
        flatpak build-bundle flatpak_repo_dir io.github.pjdude.SimpleAudioSweeper.flatpak io.github.pjdude.SimpleAudioSweeper

    #####################################
    - name: upload flatpak local
      uses: actions/upload-artifact@v4
      with:
        name: flatpak-local
        path: ./io.github.pjdude.SimpleAudioSweeper.flatpak
        if-no-files-found: error

    #####################################
    - name: rename linux flatpak
      run: mv ./io.github.pjdude.SimpleAudioSweeper.flatpak ./sas.${{ steps.version.outputs.version }}.flatpak

    #####################################
    - name: upload flatpak metainfo
      uses: actions/upload-artifact@v4
      with:
        name: flatpak-files-${{ steps.version.outputs.version }}
        path: |
            ./io.github.pjdude.SimpleAudioSweeper.metainfo.xml
            ./io.github.pjdude.SimpleAudioSweeper.git.yml
        if-no-files-found: error

    #####################################
    - name: download windows pyinstaller distro
      uses: actions/download-artifact@v6
      with:
        name: pyinstaller-win
        path: ./

    #####################################
    - name: rename windows distro
      run: mv ./sas.win.zip ./sas.${{ steps.version.outputs.version }}.win.zip

    #####################################
    - name: rename linux distro
      run: mv ./build-pyinstaller/sas.lin.zip ./sas.${{ steps.version.outputs.version }}.lin.zip

    #####################################
    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: sas ${{ steps.version.outputs.version }}
        draft: false
        prerelease: true
        files: |
            sas.${{ steps.version.outputs.version }}.lin.zip
            sas.${{ steps.version.outputs.version }}.win.zip
            sas.${{ steps.version.outputs.version }}.flatpak
